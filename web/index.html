<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CrackWatch">
<title>CrackWatch</title>
<meta name="description" content="Measure a wall crack to a tenth of a millimetre with your phone and a printed card, and see whether it grows.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/onest-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/onest-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/app.css">
</head>
<body class="ui-root">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-wall" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9 4.5v5M15 9.5v5M9 14.5v5"/></symbol>
  <symbol id="i-crack" viewBox="0 0 24 24"><path d="M7 3.5l4.2 6.2-2.5 3 4.6 7.8M13.3 20.5l1.6-5 4.6-2"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h13A1.5 1.5 0 0 1 20 7.5v2.2a2.3 2.3 0 0 0 0 4.6v2.2a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 16.5v-2.2a2.3 2.3 0 0 0 0-4.6z"/><path d="M14.5 6v12" stroke-dasharray="1.6 2"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.6"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.4-2h6.2l1.4 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.8" r="3.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
  <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3.1-3.1a4 4 0 0 0-5.7-5.7l-1.3 1.3"/><path d="M14 10a4 4 0 0 0-5.7 0l-3.1 3.1a4 4 0 0 0 5.7 5.7l1.3-1.3"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M12 13v4M10 15h4"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6.5 3.5h7l4 4v12a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-15a1 1 0 0 1 1-1z"/><path d="M13.5 3.5v4h4M8.5 12.5h7M8.5 16h5"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.1-2.4 3.6M12 16.8v.2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.6a2 2 0 0 1 3.4 0l7.1 12.6a2 2 0 0 1-1.7 3H4.9a2 2 0 0 1-1.7-3z"/><path d="M12 9.5v4.2M12 16.8v.2"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 7.8v.3"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4v4h-4"/></symbol>
  <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5M10.5 8v5M8 10.5h5"/></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M12 3v18"/><path d="m8 10-2 2 2 2M16 10l2 2-2 2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.9 12.5a1 1 0 0 0 1 .9h7.2a1 1 0 0 0 1-.9L17.5 7"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L9 19H5v-4z"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h3v3H8zM13 10h3v3h-3zM8 13h3v3H8z"/></symbol>
  <symbol id="i-agent" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3.5"/><path d="m7.5 10 2.5 2-2.5 2M12.5 15h4"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m4 17 5-4.5 3.5 3 3-2.5 4.5 4"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="6" rx="2"/><rect x="3.5" y="13.5" width="17" height="6" rx="2"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></symbol>
</svg>

<header class="topbar">
  <button class="round" type="button" id="brandBtn" aria-label="CrackWatch"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 3.8l4 6-2.4 3 4.4 7.4M14.2 20.2l1.5-4.8 4.3-2"/></svg></button>
  <button class="round" type="button" id="backBtn" hidden data-i18n-aria="back" aria-label="Back"><svg class="ui-icon"><use href="#i-chev-l"/></svg></button>
  <div class="topbar__end">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
      <button type="button" data-lang="fr" lang="fr" aria-label="Français" aria-pressed="false">FR</button>
    </div>
    <button class="round" type="button" id="settingsBtn" data-i18n-aria="settings" aria-label="Settings"><svg class="ui-icon"><use href="#i-dots"/></svg></button>
  </div>
</header>

<main id="content" class="page" tabindex="-1">
  <section class="view" id="view-measure" data-view="measure"></section>
  <section class="view" id="view-analyze" data-view="analyze" hidden></section>
  <section class="view" id="view-result" data-view="result" hidden></section>
  <section class="view" id="view-cracks" data-view="cracks" hidden></section>
  <section class="view" id="view-crack" data-view="crack" hidden></section>
  <section class="view" id="view-shared" data-view="shared" hidden></section>
</main>

<nav class="tabbar" aria-label="Views">
  <a href="#cracks" data-nav="cracks"><svg class="ui-icon"><use href="#i-list"/></svg><span data-i18n="tabCracks">My cracks</span><b class="count" data-count="cracks" hidden></b></a>
  <a href="#measure" data-nav="measure"><svg class="ui-icon"><use href="#i-camera"/></svg><span data-i18n="tabMeasure">Measure</span></a>
</nav>

<dialog class="ui-sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="ui-sheet__grabber"></div>
  <div class="ui-sheet__bar">
    <button class="ui-button ui-button--plain" type="button" data-sheet-close data-i18n="close">Close</button>
    <h2 class="ui-sheet__title" id="sheetTitle"></h2>
    <span></span>
  </div>
  <div class="ui-sheet__body" id="sheetBody"></div>
</dialog>

<dialog class="ui-sheet ui-alert" id="alert" aria-labelledby="alertTitle" aria-describedby="alertText">
  <div class="ui-sheet__body"><h2 id="alertTitle"></h2><p id="alertText"></p></div>
  <div class="ui-alert__actions">
    <button class="ui-button" type="button" id="alertCancel" data-i18n="cancel">Cancel</button>
    <button class="ui-button ui-button--destructive" type="button" id="alertOk"></button>
  </div>
</dialog>

<input type="file" id="fileInput" accept="image/jpeg,image/png,image/*" capture="environment" hidden>
<script type="module" src="/app.js"></script>
</body>
</html>
