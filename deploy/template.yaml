# CrackWatch hosted demo — one container Lambda (arm64 / Graviton) behind an API Gateway HTTP API.
# Deploy with deploy/deploy.sh (plain `aws cloudformation deploy`; the SAM transform runs server-side,
# so neither the SAM CLI nor Docker is required). Data resources are retained if the stack is deleted.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CrackWatch - OpenCV 5 crack gauge + Bedrock agent (hosted demo)

Parameters:
  ImageUri:
    Type: String
    Description: ECR image (arm64) built by deploy/build_image.sh, pinned by digest
  ModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
  FoundationModelId:
    Type: String
    Default: amazon.nova-2-lite-v1:0
  VisitSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: salt of the anonymous visitor hash (random, generated by deploy.sh, never committed)
  MaxInspectionsPerDay:
    Type: Number
    Default: 1500
  MaxInspectionsPerVisitorPerDay:
    Type: Number
    Default: 80
  MaxLlmCallsPerDay:
    Type: Number
    Default: 250

Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-uploads-after-1-day, Status: Enabled, Prefix: uploads/, ExpirationInDays: 1}
          - {Id: abort-incomplete, Status: Enabled, AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}}
      CorsConfiguration:
        # browser POST through a presigned policy only (5 min, image/jpeg, <= 15 MB); the policy is the guard
        CorsRules: [{AllowedMethods: [POST], AllowedOrigins: ["*"], AllowedHeaders: ["*"], MaxAge: 300}]
      Tags: [{Key: project, Value: crackwatch}]

  UploadsBucketTlsOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt UploadsBucket.Arn, !Sub "${UploadsBucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      SSESpecification: {SSEEnabled: true}
      Tags: [{Key: project, Value: crackwatch}]

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/crackwatch-api
      RetentionInDays: 14

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings: {ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10}
      RouteSettings:
        "POST /api/{proxy+}": {ThrottlingBurstLimit: 6, ThrottlingRateLimit: 3}
      Tags: {project: crackwatch}

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: crackwatch-api
      Description: CrackWatch demo API (OpenCV 5.0.0, Python 3.12, arm64)
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures: [arm64]
      MemorySize: 3008
      Timeout: 29
      Environment:
        Variables:
          TABLE: !Ref Table
          BUCKET: !Ref UploadsBucket
          MODEL_ID: !Ref ModelId
          CW_VISIT_SECRET: !Ref VisitSecret
          CW_MAX_INSPECTIONS_PER_DAY: !Ref MaxInspectionsPerDay
          CW_MAX_INSPECTIONS_PER_VISITOR_DAY: !Ref MaxInspectionsPerVisitorPerDay
          CW_MAX_LLM_CALLS_PER_DAY: !Ref MaxLlmCallsPerDay
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${UploadsBucket.Arn}/uploads/*"
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource: !GetAtt Table.Arn
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
                - !Sub "arn:aws:bedrock:*::foundation-model/${FoundationModelId}"
      Events:
        Root: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: /, Method: GET}}
        Static: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/{proxy+}", Method: GET}}
        Api: {Type: HttpApi, Properties: {ApiId: !Ref HttpApi, Path: "/api/{proxy+}", Method: POST}}
      Tags: {project: crackwatch}

Outputs:
  DemoUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref UploadsBucket
