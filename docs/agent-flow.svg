<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title>CrackWatch agent flow: how OpenCV outputs change the next action</title>
  <rect width="1200" height="560" fill="#F2F2F7"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3A3A3C"/></marker>
    <style>
      .box{fill:#fff;stroke:#C7C7CC;stroke-width:1}
      .q{fill:#fff;stroke:#0071E3;stroke-width:1.5}
      .t{font-size:16px;font-weight:600;fill:#000}
      .s{font-size:13px;fill:#3A3A3C}
      .m{font-size:13px;fill:#000;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:600}
      .l{stroke:#3A3A3C;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .y{font-size:12px;fill:#6E6E73}
    </style>
  </defs>
  <text x="40" y="46" font-size="24" font-weight="700">The visual result decides the next tool call</text>
  <text x="40" y="70" class="s">Each test reads an OpenCV 5 output. Nova 2 Lite picks the tool and writes the instruction; the rules below validate it and are the fallback.</text>

  <rect x="40" y="100" width="190" height="80" rx="12" class="box"/>
  <text x="56" y="130" class="t">Photo measured</text>
  <text x="56" y="152" class="s">card, blur, widths, σ</text>

  <rect x="290" y="100" width="200" height="80" rx="12" class="q"/>
  <text x="306" y="130" class="t">Card found? Sharp?</text>
  <text x="306" y="152" class="s">blur ≤ 2.2 px, glare ≤ 3 %</text>
  <rect x="290" y="250" width="200" height="60" rx="12" class="box"/>
  <text x="306" y="286" class="m">request_retake</text>

  <rect x="550" y="100" width="200" height="80" rx="12" class="q"/>
  <text x="566" y="130" class="t">Width resolved?</text>
  <text x="566" y="152" class="s">≥ 3 px across, depth fitted</text>
  <rect x="550" y="250" width="200" height="80" rx="12" class="box"/>
  <text x="566" y="282" class="m">request_closer_photo</text>
  <text x="566" y="304" class="s">region (mm) + zoom factor</text>

  <rect x="810" y="100" width="170" height="80" rx="12" class="q"/>
  <text x="826" y="130" class="t">Earlier visit?</text>
  <text x="826" y="152" class="s">not compared yet</text>
  <rect x="810" y="250" width="170" height="80" rx="12" class="box"/>
  <text x="826" y="282" class="m">compare_with_</text>
  <text x="826" y="300" class="m">previous</text>

  <rect x="1030" y="100" width="140" height="80" rx="12" class="q"/>
  <text x="1046" y="126" class="t">Threshold?</text>
  <text x="1046" y="148" class="s">max − 2σ ≥ 1 mm</text>
  <text x="1046" y="166" class="s">or widening ≥ 0.2</text>

  <rect x="1000" y="250" width="170" height="80" rx="12" class="box"/>
  <text x="1016" y="282" class="m">propose_ticket</text>
  <text x="1016" y="304" class="s">waits for a human</text>
  <rect x="1000" y="400" width="170" height="60" rx="12" class="box"/>
  <text x="1016" y="436" class="m">schedule_next_visit</text>

  <path class="l" d="M230 140 H286"/>
  <path class="l" d="M490 140 H546"/><text x="500" y="132" class="y">yes</text>
  <path class="l" d="M750 140 H806"/><text x="760" y="132" class="y">yes</text>
  <path class="l" d="M980 140 H1026"/><text x="988" y="132" class="y">no</text>
  <path class="l" d="M390 180 V246"/><text x="398" y="220" class="y">no</text>
  <path class="l" d="M650 180 V246"/><text x="658" y="220" class="y">no</text>
  <path class="l" d="M895 180 V246"/><text x="903" y="220" class="y">yes</text>
  <path class="l" d="M1100 180 V246"/><text x="1108" y="220" class="y">yes</text>
  <path class="l" d="M1170 160 Q1195 160 1195 300 Q1195 430 1174 430"/><text x="1140" y="380" class="y">no</text>
  <path class="l" d="M895 330 V370 H992 V168 H1026" opacity="0.55"/>
  <text x="760" y="392" class="y">comparison added to the state, loop again</text>

  <path class="l" d="M390 310 V500 H130 V184" opacity="0.55"/>
  <path class="l" d="M650 330 V500" opacity="0.55"/>
  <text x="140" y="520" class="y">the inspector takes a new photo (closer, at the drawn region) → measured again → the loop restarts</text>
</svg>
